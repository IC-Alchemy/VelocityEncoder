sentence=Velocity-sensitive Arduino driver for the AS5600 12-bit magnetic encoder, tuned for instruments you play.
paragraph=Reads the AS5600 over I2C and provides raw and normalized angle, multi-turn cumulative position with 12-bit wrap-around correction, and a filtered angular-speed reading in degrees per second. Includes a tunable velocity-scaled parameter increment so a knob turns slowly for fine control and fast for wide sweeps, with an adaptive low-pass filter and response curve that are fully configurable at construction.
