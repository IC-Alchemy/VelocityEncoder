; MIDI2HiResKnob — AS5600 magnetic encoder → high-resolution MIDI 2.0 CC
; Target: Raspberry Pi Pico 2 (RP2350), arduino-pico core, Adafruit TinyUSB
;
; Build:  pio run
; Flash:  pio run -t upload      (or drag the UF2 from .pio/build onto RPI-RP2)
; Serial: pio device monitor
;
; The CFG_TUD_UMP flags are why this example is a PlatformIO project:
; the tusb_ump class driver must be enabled at compile time, which the
; Arduino IDE cannot do for the arduino-pico core.

[env:pico2-midi2-knob]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
framework        = arduino
board            = rpipico2
board_build.core = earlephilhower
monitor_speed    = 115200

build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_UMP=1
    -DCFG_TUD_UMP_RX_BUFSIZE=512
    -DCFG_TUD_UMP_TX_BUFSIZE=512
    -DCFG_TUD_MIDI=0
    ; keep USB descriptor callback symbols when --gc-sections is active
    -Wl,-u,tud_descriptor_device_cb
    -Wl,-u,tud_descriptor_configuration_cb
    -Wl,-u,tud_descriptor_string_cb

lib_deps =
    ; the AS5600 / MagEncoder library (two levels up from this file)
    symlink://../../
    ; AmeNote tusb_ump USB MIDI 2.0 class driver for TinyUSB
    https://github.com/midi2-dev/tusb_ump.git
